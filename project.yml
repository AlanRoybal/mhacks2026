name: Bounty
options:
  bundleIdPrefix: com.alanroybal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CoinbaseWallet:
    url: https://github.com/MobileWalletProtocol/wallet-mobile-sdk
    exactVersion: 1.1.2
  TwinKit:
    path: Packages/TwinKit
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    exactVersion: 26.12.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DVX8YZ9GG9
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Bounty:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Bounty
        excludes:
          - Info.plist
    dependencies:
      - package: CoinbaseWallet
        product: CoinbaseWalletSDK
      - package: TwinKit
        product: TwinKit
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alanroybal.BountyTwin
        PRODUCT_NAME: Bounty
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bounty/Info.plist
        CODE_SIGN_ENTITLEMENTS: "$(BOUNTY_CODE_SIGN_ENTITLEMENTS)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Bounty/Info.plist
      properties:
        CFBundleDisplayName: Bounty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        # Static launch screen: surface/canvas white, no image. The launch animation starts on the same white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.alanroybal.BountyTwin.oauth
            CFBundleURLSchemes: [bounty]
        BountyLinkedInClientID: 86rcq1bjy06k5g
        # iOS-type Google OAuth client for the Gmail import. Set BOUNTY_GOOGLE_CLIENT_ID in Config/*.xcconfig.
        BountyGoogleClientID: $(BOUNTY_GOOGLE_CLIENT_ID)
        # Set in Config/*.xcconfig (Local.xcconfig for your machine).
        BountyAPIBaseURL: $(BOUNTY_API_BASE_URL)
        LSApplicationQueriesSchemes: [cbwallet, "mwp+1.1"]
        BountySettlementsBaseURL: $(BOUNTY_SETTLEMENTS_BASE_URL)
        BountyPaymentsBaseURL: $(BOUNTY_PAYMENTS_BASE_URL)
        BountyApplePayMerchantIdentifier: $(BOUNTY_APPLE_PAY_MERCHANT_IDENTIFIER)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Bounty connects to the local Bounty and payment test servers during development.
        NSFaceIDUsageDescription: Bounty uses Face ID to confirm you want to accept a job.
        NSCameraUsageDescription: Bounty uses the camera to capture proof that a job was completed.
        NSCalendarsFullAccessUsageDescription: Bounty uses your calendar availability to avoid offering jobs when you are busy. Event names never leave this device.
        NSMicrophoneUsageDescription: Bounty records sound with proof videos you take in the app.
        NSLocationWhenInUseUsageDescription: Bounty uses your location to match nearby jobs and verify on-site work.
    scheme:
      testTargets: [BountyScreenshots]
  # Pitch screenshots in the Simulator (BountyScreenshots/ScreenshotTour.swift). Not part of the app.
  BountyScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [BountyScreenshots]
    dependencies:
      - target: Bounty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alanroybal.BountyTwin.Screenshots
        PRODUCT_NAME: BountyScreenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bounty
        CODE_SIGN_ENTITLEMENTS: ""
