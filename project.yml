name: Bounty
options:
  bundleIdPrefix: com.alanroybal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TwinKit:
    path: Packages/TwinKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DVX8YZ9GG9
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Bounty:
    type: application
    platform: iOS
    sources:
      - path: Bounty
    dependencies:
      - package: TwinKit
        product: TwinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alanroybal.BountyTwin
        PRODUCT_NAME: Bounty
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bounty/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bounty/Bounty.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Bounty/Info.plist
      properties:
        CFBundleDisplayName: Bounty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.alanroybal.BountyTwin.oauth
            CFBundleURLSchemes: [bounty]
        BountyLinkedInClientID: 86rcq1bjy06k5g
        NSFaceIDUsageDescription: Bounty uses Face ID to confirm you want to accept a job.
        NSCameraUsageDescription: Bounty uses the camera to capture proof that a job was completed.
        NSCalendarsFullAccessUsageDescription: Bounty uses your calendar availability to avoid offering jobs when you are busy. Event names never leave this device.
        NSLocationWhenInUseUsageDescription: Bounty uses your location to match nearby jobs and verify on-site work.
    scheme:
      testTargets: []
